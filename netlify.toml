[build]
  command = "npm run build"
  publish = "dist"

# Proxy API requests to backend server (or configure via Netlify environment variable)
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-api.onrender.com/api/:splat"
  status = 200
  force = false

# SPA fallback redirect for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
