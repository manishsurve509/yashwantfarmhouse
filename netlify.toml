[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/**", "server/**"]

# Route /api/* requests to the Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Fallback for React SPA client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
